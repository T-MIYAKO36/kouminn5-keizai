    <circle cx="400" cy="680" r="82"/>
    <circle cx="120" cy="400" r="82"/>
  </g>
  <circle cx="400" cy="400" r="133" fill="url(#core)" stroke="#fff0aa" stroke-width="14" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="92" fill="#17202a" stroke="#6d4615" stroke-width="7"/>
  <g fill="none" stroke="#fff1c5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
