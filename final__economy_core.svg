  <circle cx="400" cy="400" r="330" fill="#151b24" fill-opacity=".82" stroke="#6b461b" stroke-width="16"/>
  <circle cx="400" cy="400" r="274" fill="none" stroke="#f6ce5a" stroke-width="12" stroke-dasharray="16 15" opacity=".65"/>
