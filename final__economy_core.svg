    <path d="M470 135A278 278 0 0 1 665 330"/>
    <path d="M665 470A278 278 0 0 1 470 665"/>
    <path d="M330 665A278 278 0 0 1 135 470"/>
    <path d="M135 330A278 278 0 0 1 330 135"/>
  </g>
  <g fill="#242a33" stroke="#e2ad3e" stroke-width="12">
